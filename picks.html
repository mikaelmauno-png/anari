<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Änäri picks</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Änäri">
  <script>document.write(`<link rel="stylesheet" href="style.css?v=${Date.now()}">`)</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
  <style>
    #pick-head h3 { margin: 0; font-size: 18px; }
    #pick-head p { margin: 4px 0 0; }
    #pick-head .sum { font-weight: 600; font-variant-numeric: tabular-nums; }
    #pick-chart { margin-top: 10px; }
    table.log th, table.log td { padding: 7px 6px; }
    table.log .l { text-align: left; }
    table.log td.b { font-weight: 700; }
    table.log tr.quiet td { color: var(--muted); }
    table.log small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Änäri</h1>
      <a href="settings.html" class="settings-link" aria-label="Settings" title="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.4-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-1-1.6.8-3.4 2.4-2.4 1 .6 2.3.1 2.5-1.1z"/><circle cx="12" cy="12" r="3"/></svg></a>
      <nav class="tabs"><a href="./">Standings</a><a href="round.html">Last<span class="wide"> round</span></a><a href="next.html">Next<span class="wide"> round</span></a><a href="picks.html" aria-current="page">Picks</a><a href="trend.html">Trend</a><a href="playoffs.html">Playoffs</a></nav>
      <div id="meta">Loading…</div>
    </header>

    <div id="pick-controls" class="controls" style="margin-top:16px"></div>

    <div id="content">
      <div class="card" style="margin-top:12px">
        <div id="pick-head"></div>
        <div id="pick-chart"></div>
        <p id="chart-note" class="hint"></p>
      </div>

      <h2>Game by game</h2>
      <div id="log"></div>
    </div>

    <footer>
      Game logs from NHL.com, newest first, updated with every stats update. GSAx per game from MoneyPuck,
      usually a few hours after the game (shown as … until then).
    </footer>
  </main>
  <script>
    // Version tag on every load so an update is never served from a stale cache
    for (const src of ["score.js", "chart.js", "picks.js"]) {
      const s = document.createElement("script");
      s.src = `${src}?v=${Date.now()}`;
      s.async = false;
      document.body.append(s);
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
  </script>
</body>
</html>
