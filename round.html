<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Änäri last round</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Änäri">
  <script>document.write(`<link rel="stylesheet" href="style.css?v=${Date.now()}">`)</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
  <script>document.write(`<script src="theme.js?v=${Date.now()}"><\/script>`)</script>
  <style>
    ul.lines { list-style: none; margin: 0; padding: 0; }
    ul.lines li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
    ul.lines li:first-child { border-top: 0; }
    ul.lines .val { font-size: 14px; }
    .cats { display: block; }
    h3.sub { font-size: 15px; margin: 20px 0 8px; }
    ul.scores { list-style: none; margin: 0; display: grid; gap: 6px 24px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); font-variant-numeric: tabular-nums; }
    ul.scores li { display: flex; gap: 6px; align-items: baseline; }
    ul.scores .win { font-weight: 700; }
    /* Game dropdowns: an open game takes the whole row of the grid */
    ul.scores li.game { display: block; }
    ul.scores li.game:has(details[open]) { grid-column: 1 / -1; }
    ul.scores summary { display: flex; gap: 6px; align-items: baseline; cursor: pointer; list-style: none; }
    ul.scores summary::-webkit-details-marker { display: none; }
    /* Small arrow: points right when closed, down when the game is open */
    ul.scores summary::after { content: "▸"; color: var(--muted); font-size: 12px; }
    ul.scores details[open] summary::after { content: "▾"; }
    .game-details { margin: 8px 0 4px; padding-top: 8px; border-top: 1px solid var(--line); }
    .linescore { overflow-x: auto; margin-bottom: 10px; }
    .linescore table { width: auto; }
    .linescore th, .linescore td { padding: 3px 10px; }
    .linescore tbody th { text-align: left; }
    .linescore .t { font-weight: 700; }
    .linescore .sog { color: var(--muted); border-left: 1px solid var(--line); }
    .box-teams { display: grid; gap: 4px 24px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .box-teams h4 { margin: 4px 0; font-size: 13px; color: var(--muted); }
    ul.box { list-style: none; margin: 0; padding: 0; font-size: 14px; }
    ul.box li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
    ul.box .val { white-space: nowrap; }
    .pick-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 6px; vertical-align: 1px; }
    tr.has-moves > * { border-bottom: 0; padding-bottom: 2px; }
    tr.moves td { text-align: left; white-space: normal; padding-top: 0; }
    .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 6px; margin: 1px 2px; border-radius: 6px; border: 1px solid currentColor; }
    /* Face-down manager cards on the last game night: tap to turn */
    .flip { perspective: 1200px; cursor: pointer; border-radius: 12px; }
    .flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .flip-inner { display: grid; transition: transform 0.6s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; height: 100%; }
    .flip.open .flip-inner { transform: rotateY(180deg); }
    .flip.open { cursor: default; }
    .flip-inner > .card { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .face-up { transform: rotateY(180deg); }
    .face-down { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 140px;
      border-top: 6px solid var(--mc);
      background: repeating-linear-gradient(135deg, var(--card) 0 10px, color-mix(in srgb, var(--mc) 12%, var(--card)) 10px 20px); }
    .fd-name { font-size: 22px; font-weight: 700; }
    .fd-hint { color: var(--muted); font-size: 13px; }
    .flip-all { margin: 0 0 8px; text-align: right; }
    .flip-all button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
    .no-anim .flip-inner { transition: none; }
    .live-badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--down); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
    .status-note { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
    /* The day's extra on a card being turned now (see revealStyle in round.js) */
    .reveal-lift .turned-now .flip-inner { transition: none; animation: lift 0.75s cubic-bezier(.3,.7,.2,1) both; }
    .reveal-lift .turned-now .face-up { animation: lift-shadow 0.75s ease; }
    @keyframes lift { from { transform: rotateY(0) scale(1); } 50% { transform: rotateY(90deg) scale(1.1) translateY(-6px); } to { transform: rotateY(180deg) scale(1); } }
    @keyframes lift-shadow { 50% { box-shadow: 0 18px 36px rgb(0 0 0 / .25); } }
    .reveal-lines .turned-now ul.lines li { animation: line-in 0.35s ease both; animation-delay: calc(0.45s + var(--i) * 90ms); }
    @keyframes line-in { from { opacity: 0; transform: translateY(6px); } }
    .reveal-winner .turned-now.win .face-up { animation: win-pulse 1.1s ease 0.6s 2; }
    @keyframes win-pulse { 40% { box-shadow: 0 0 0 4px var(--mc), 0 0 22px 4px color-mix(in srgb, var(--mc) 60%, transparent); } }
    /* ---------- Themed reaction when a turned card shows a gain (themedReaction in round.js) ---------- */
    /* The face-up side is where the Newspaper stamp is positioned */
    .face-up { position: relative; }

    /* Light (rink): a red goal lamp flashes around the card twice.
       4 alternating runs = on, off, on, off, so it ends dark. */
    :root[data-theme="light"] .gain-now .face-up { animation: goal-lamp 0.45s ease-in-out 4 alternate; }
    @keyframes goal-lamp {
      to { box-shadow: 0 0 0 3px #e0102e, 0 0 34px 14px rgb(255 30 30 / 0.55); background: #fff1f2; }
    }

    /* Vaporwave: the name and stat lines flicker on like a neon sign warming up,
       then keep a glow in the manager's color; the lines glitch sideways twice */
    :root[data-theme="vaporwave"] .gain-now .face-up :is(h3, .val) { animation: neon-on 1.3s linear both; }
    @keyframes neon-on {
      0% { opacity: 0.15; } 6% { opacity: 1; } 10% { opacity: 0.2; } 18% { opacity: 1; } 22% { opacity: 0.4; }
      30%, 100% { opacity: 1; text-shadow: 0 0 10px color-mix(in srgb, var(--mc) 70%, transparent); }
    }
    :root[data-theme="vaporwave"] .gain-now .face-up ul.lines { animation: glitch 0.24s steps(2) 0.3s 2; }
    @keyframes glitch {
      0% { transform: translateX(-3px); text-shadow: -2px 0 #ff3d7f, 2px 0 #2ee6e6; }
      100% { transform: translateX(3px); text-shadow: 2px 0 #ff3d7f, -2px 0 #2ee6e6; }
    }

    /* Newspaper: a tilted "Extra!" stamp lands on the card with a thump, and stays */
    :root[data-theme="newspaper"] .stamp {
      position: absolute; top: 10px; right: 12px; pointer-events: none;
      font: 900 15px/1 Georgia, "Times New Roman", serif; text-transform: uppercase; letter-spacing: 0.06em;
      color: #8b1e1e; border: 3px double #8b1e1e; border-radius: 4px; padding: 5px 8px 4px;
      transform: rotate(-8deg); opacity: 0.85;
      animation: stamp-in 0.32s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes stamp-in { from { transform: rotate(-8deg) scale(2.6); opacity: 0; } }
    :root[data-theme="newspaper"] .flip.stamped { animation: thump 0.2s ease 0.28s; }
    @keyframes thump { 50% { transform: translateY(3px); } }

    @media (prefers-reduced-motion: reduce) {
      .flip-inner { transition: none; }
      .flip, .flip .flip-inner, .flip .face-up, .flip li, .flip ul, .flip h3, .flip .val { animation: none !important; }
      /* The stamp still shows, just without landing */
      .stamp { animation: none !important; }
    }
  </style>
</head>

      <nav class="tabs"><a href="./">Standings</a><a href="round.html" aria-current="page">Last<span class="wide"> round</span></a><a href="next.html">Next<span class="wide"> round</span></a><a href="picks.html">Picks</a><a href="trend.html">Trend</a><a href="playoffs.html">Playoffs</a></nav>

    <h2 id="night-title">Last game night</h2>
    <div id="night"></div>

    <h2 id="week-title">This week so far</h2>

    <h2 id="lastweek-title">Last week</h2>
    <div id="lastweek"></div>

    <footer>
      Weeks run Monday–Sunday. GSAx from <a href="https://moneypuck.com/">MoneyPuck</a> can show up a few hours after the NHL stats.
    </footer>

  <script>
    // Version tag on every load so an update is never served from a stale cache
    for (const src of ["score.js", "round.js"]) {
      const s = document.createElement("script");
      s.src = `${src}?v=${Date.now()}`;
      s.async = false;
      document.body.append(s);
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
  </script>
</body>
</html>
