name: Update stats

on:
  # The main timetable is an external cron job (cron-job.org) that starts this
  # workflow through the API at :30 Finnish time: hourly 04:30-11:30, then
  # 15:30, 19:30 and 23:30. GitHub's own schedule below is only a backup, since
  # GitHub often starts scheduled runs hours late or skips them.
  schedule:
    - cron: "47 2,8,14,20 * * *"  # UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/fetch_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update stats"
          # main may have moved on while the fetch ran (a picks edit, or another
          # update that GitHub started late). Rebase onto it; if both changed the
          # same data file, keep this run's copy, which was just fetched.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
