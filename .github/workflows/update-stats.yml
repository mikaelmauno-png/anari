name: Update stats

on:
  # Mornings are timed by an external cron job (cron-job.org) that starts this
  # workflow through the API hourly 05:30-09:30 Finnish time, when the night's
  # results come in. GitHub's own schedule below covers the rest of the day as
  # a best effort (GitHub often starts scheduled runs late or skips them):
  # about 11:47, 15:47, 19:47 and 23:47 Finnish summer time, an hour earlier in winter.
  schedule:
    - cron: "47 8,12,16,20 * * *"  # UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/fetch_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # .gitattributes: on a caphits.json conflict keep the repo's copy (hand edits)
          git config merge.keep-upstream.driver true
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update stats"
          # main may have moved on while the fetch ran (a picks edit, or another
          # update that GitHub started late). Rebase onto it; if both changed the
          # same data file, keep this run's copy, which was just fetched.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
