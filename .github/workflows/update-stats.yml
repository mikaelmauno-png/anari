name: Update stats

on:
  schedule:
    # Every 3 hours; NHL games finish late evening / night Finnish time
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
