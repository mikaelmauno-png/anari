<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Änäri settings</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Änäri">
  <script>document.write(`<link rel="stylesheet" href="style.css?v=${Date.now()}">`)</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
  <style>
    .option { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .option:first-child { border-top: 0; }
    .option input:disabled + span { opacity: 0.6; }
    .option input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
    .option small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
    #reset button { font: inherit; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; margin-top: 10px; }
    #saved { color: var(--up); font-size: 13px; margin-left: 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Änäri</h1>
      <nav class="tabs"><a href="./">Standings</a><a href="round.html">Last<span class="wide"> round</span></a><a href="next.html">Next<span class="wide"> round</span></a><a href="trend.html">Trend</a><a href="playoffs.html">Playoffs</a><a href="settings.html" class="gear" aria-label="Settings" title="Settings" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.4-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-1-1.6.8-3.4 2.4-2.4 1 .6 2.3.1 2.5-1.1z"/><circle cx="12" cy="12" r="3"/></svg></a></nav>
      <div id="meta">Settings are saved on this device only.</div>
    </header>

    <h2>Who are you? <span id="saved"></span></h2>
    <div class="card"><div id="me"></div></div>

    <h2>Last game night cards</h2>
    <div class="card">
      <div id="cards"></div>
      <div id="reset"></div>
    </div>

    <h2>Spoiler-free mode</h2>
    <div class="card"><div id="spoilers"></div></div>
  </main>
  <script>
    // Version tag on every load so an update is never served from a stale cache
    for (const src of ["score.js", "settings.js"]) {
      const s = document.createElement("script");
      s.src = `${src}?v=${Date.now()}`;
      s.async = false;
      document.body.append(s);
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
  </script>
</body>
</html>
