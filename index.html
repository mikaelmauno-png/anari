<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Änäri standings</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Änäri">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 id="league-name">Änäri</h1>
      <nav class="tabs"><a href="./" aria-current="page">Standings</a><a href="round.html">Last round</a><a href="trend.html">Trend</a></nav>
      <div id="meta">Loading…</div>
    </header>

    <h2>Standings</h2>
    <div id="standings"></div>

    <h2>Categories</h2>
    <div id="categories"></div>

    <footer>
      Scoring per category: 1st 5 · 2nd 3 · 3rd 2 · 4th 1. Ties in the points categories are broken by goals; picks still tied share the higher place.
      Stats: <a href="https://www.nhl.com/stats/">NHL.com</a>, GSAx from <a href="https://moneypuck.com/">MoneyPuck</a>.
    </footer>
  </main>
  <script>
    // Version tag on every load so an update is never served from a stale cache
    for (const src of ["score.js", "app.js"]) {
      const s = document.createElement("script");
      s.src = `${src}?v=${Date.now()}`;
      s.async = false;
      document.body.append(s);
    }
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
  </script>
</body>
</html>
